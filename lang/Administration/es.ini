timeline_label = "Cronología"
timeline_description = "Representa hitos cronológicos, fases de proyecto y pasos de proceso."
timeline_example_1 = "Convierte las fases descubrimiento, prototipo, piloto y despliegue en una cronología concisa."
accordions_label = "Acordeones y detalles"
accordions_description = "Agrupa explicaciones largas en secciones expandibles y accesibles."
accordions_example_1 = "Explica instalación, configuración y solución de problemas en secciones expandibles separadas."
data_downloads_label = "Descargas CSV y JSON"
data_downloads_description = "Crea una descarga local con datos ya incluidos en la respuesta del asistente."
data_downloads_example_1 = "Crea un archivo CSV descargable con las columnas name, status y due_date a partir de las siguientes tareas."
mermaid_label = "Diagramas (Mermaid)"
mermaid_description = "Permite al asistente generar diagramas Mermaid y renderiza mensajes finalizados o restaurados."
mermaid_requirement_1 = "Renderizador Markdown de ClientStack"
mermaid_requirement_2 = "Biblioteca Mermaid de ClientStack"
mermaid_example_1 = "Crea un diagrama de flujo Mermaid para una solicitud que se revisa, aprueba, implementa y finalmente prueba."
mermaid_example_2 = "Muestra el proceso de inicio de sesión entre usuario, cliente, servidor de autenticación y servidor de recursos como diagrama de secuencia Mermaid."
charts_label = "Gráficos (Chart.js)"
charts_description = "Representa gráficos seguros de barras, líneas, sectores y anillos a partir de respuestas estructuradas compactas del asistente."
charts_requirement_1 = "Renderizador Markdown de ClientStack"
charts_requirement_2 = "Biblioteca Chart.js de ClientStack"
charts_example_1 = "Visualiza los ingresos trimestrales 120000, 145000, 138000 y 171000 como gráfico de barras."
charts_example_2 = "Compara las solicitudes mensuales de soporte del Producto A y el Producto B como gráfico de líneas."
tables_label = "Tablas de datos (ModularGrid)"
tables_description = "Representa tablas de datos seguras, buscables y paginadas a partir de respuestas estructuradas compactas del asistente."
tables_requirement_1 = "Renderizador Markdown de ClientStack"
tables_requirement_2 = "Biblioteca ModularGrid de ClientStack"
tables_example_1 = "Presenta las tareas del proyecto con responsable, estado, prioridad y fecha límite como tabla de datos buscable."
tables_example_2 = "Compara los siguientes productos por precio, disponibilidad, valoración y plazo de entrega en una tabla ordenable."
maps_label = "Mapas (Leaflet)"
maps_description = "Muestra mapas interactivos seguros con puntos sobre mapas de calles, satélite o topográficos."
maps_requirement_1 = "Renderizador Markdown de ClientStack"
maps_requirement_2 = "Biblioteca Leaflet de ClientStack"
maps_requirement_3 = "Acceso a Internet al proveedor de teselas seleccionado"
maps_example_1 = "Muestra Berlín, Hamburgo, Múnich, Colonia y Fráncfort como puntos etiquetados en un mapa de calles."
maps_example_2 = "Coloca las siguientes ubicaciones de campo en un mapa topográfico y añade una breve descripción a cada marcador."
redirect_label = "Navegación del portal"
redirect_description = "Navega la pestaña actual del navegador a una URL de la plataforma del mismo origen solicitada explícitamente por el usuario."
redirect_requirement_1 = "Renderizador Markdown de ClientStack"
redirect_example_1 = "Llévame al panel del proyecto en /projects/dashboard."
