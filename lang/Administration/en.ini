mathjax_label = "Mathematical formulas (MathJax)"
mathjax_description = "Lets the assistant emit MathJax TeX and typesets completed or restored assistant messages."
mathjax_requirement_1 = "ClientStack MathJax library"
mathjax_example_1 = "Explain the quadratic formula and show the derivation with properly rendered formulas."
mathjax_example_2 = "Create a short linear algebra example with a matrix, a column vector, and their product."
callouts_label = "Callouts and notices"
callouts_description = "Renders structured information, success, warning, and error notices."
callouts_example_1 = "Summarize the key result and show the most important warning as a callout."
kpi_cards_label = "KPI cards"
kpi_cards_description = "Displays compact cards for key figures, changes, and short explanations."
kpi_cards_example_1 = "Present these reporting figures as KPI cards: 1,240 users, 68% completion, and 4.7/5 satisfaction."
progress_label = "Progress indicators"
progress_description = "Visualizes one or more bounded progress values without an external library."
progress_example_1 = "Show the completion of Analysis 80%, Implementation 55%, and Testing 25% as progress indicators."
timeline_label = "Timeline"
timeline_description = "Renders chronological milestones, project phases, and process steps."
timeline_example_1 = "Turn the project phases discovery, prototype, pilot, and rollout into a concise timeline."
accordions_label = "Accordions and details"
accordions_description = "Groups longer explanations into accessible expandable sections."
accordions_example_1 = "Explain installation, configuration, and troubleshooting in separate expandable sections."
data_downloads_label = "CSV and JSON downloads"
data_downloads_description = "Creates a local download from data already contained in the assistant response."
data_downloads_example_1 = "Create a downloadable CSV file with the columns name, status, and due_date from the following tasks."
mermaid_label = "Diagrams (Mermaid)"
mermaid_description = "Lets the assistant generate Mermaid diagrams and renders completed or restored assistant messages."
mermaid_requirement_1 = "ClientStack Markdown renderer"
mermaid_requirement_2 = "ClientStack Mermaid library"
mermaid_example_1 = "Create a Mermaid flowchart for a request that is reviewed, approved, implemented, and finally tested."
mermaid_example_2 = "Show the login process between user, client, authentication server, and resource server as a Mermaid sequence diagram."
charts_label = "Charts (Chart.js)"
charts_description = "Renders safe bar, line, pie, and doughnut charts from compact structured assistant output."
charts_requirement_1 = "ClientStack Markdown renderer"
charts_requirement_2 = "ClientStack Chart.js library"
charts_example_1 = "Visualize the quarterly revenue values 120000, 145000, 138000, and 171000 as a bar chart."
charts_example_2 = "Compare the monthly support requests for Product A and Product B as a line chart."
tables_label = "Data tables (ModularGrid)"
tables_description = "Renders safe searchable and pageable data tables from compact structured assistant output."
tables_requirement_1 = "ClientStack Markdown renderer"
tables_requirement_2 = "ClientStack ModularGrid library"
tables_example_1 = "Present the project tasks with owner, status, priority, and due date as a searchable data table."
tables_example_2 = "Compare the following products by price, availability, rating, and delivery time in a sortable table."
maps_label = "Maps (Leaflet)"
maps_description = "Renders safe interactive point maps with street, satellite, or topographic base maps."
maps_requirement_1 = "ClientStack Markdown renderer"
maps_requirement_2 = "ClientStack Leaflet library"
maps_requirement_3 = "Internet access to the selected tile provider"
maps_example_1 = "Show Berlin, Hamburg, Munich, Cologne, and Frankfurt as labeled points on a street map."
maps_example_2 = "Place the following field locations on a topographic map and add a short description to each marker."
redirect_label = "Portal navigation"
redirect_description = "Navigates the current browser tab to a same-origin platform URL explicitly requested by the user."
redirect_requirement_1 = "ClientStack Markdown renderer"
redirect_example_1 = "Take me to the project dashboard at /projects/dashboard."
